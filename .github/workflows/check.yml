name: Check survey bot
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/update-live.mjs
      - run: node --test test/surveys.test.mjs test/russian-localization.test.mjs test/update-live.test.mjs
      - run: node --test --test-name-pattern='^(?!1,000 concurrent)' test/survey-capacity.test.mjs
      - run: npm install --no-save --package-lock=false wrangler@4.166.0
      - run: node --test test/survey-worker-integration.test.mjs
      - run: node --test --test-name-pattern='1,000 concurrent' test/survey-capacity.test.mjs
      - run: npx wrangler deploy --dry-run
      - name: Check public live endpoint (read-only)
        continue-on-error: true
        run: node scripts/check-live-health.mjs
